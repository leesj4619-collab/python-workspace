<!DOCTYPE html>
<html>
<head>
    <title>장면 분류기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border-radius: 20px; padding: 40px; width: 420px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #888; margin-bottom: 24px; font-size: 14px; }
        .upload-box { border: 2px dashed #ccc; border-radius: 12px; padding: 30px; cursor: pointer; margin-bottom: 20px; transition: border-color 0.2s; }
        .upload-box:hover { border-color: #1976d2; }
        #preview { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; display: none; margin-bottom: 16px; }
        button { width: 100%; padding: 14px; background: #1976d2; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1565c0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 24px; padding: 20px; background: #f9f9f9; border-radius: 12px; display: none; }

        /* 알 수 없는 장면일 때 노란색 */
        .result-box.unknown { background: #fff3cd; border: 2px solid #ffc107; }
        .label.unknown { color: #856404; }

        .animal { font-size: 64px; margin-bottom: 8px; }
        .label { font-size: 28px; font-weight: bold; color: #333; }
        .conf { font-size: 14px; color: #888; margin-top: 4px; }

        /* 6가지 종류 버튼 힌트 */
        .classes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; }
        .class-tag { background: #e3f2fd; color: #1976d2; border-radius: 20px; padding: 4px 12px; font-size: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h1>장면 분류기</h1>
    <p>풍경 사진을 올리면 AI가 어떤 장면인지 맞춰요</p>

    <!-- 6가지 종류 태그 표시 -->
    <div class="classes">
        <span class="class-tag">건물</span>
        <span class="class-tag">숲</span>
        <span class="class-tag">빙하</span>
        <span class="class-tag">산</span>
        <span class="class-tag">바다</span>
        <span class="class-tag">거리</span>
    </div>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <img id="preview" src="" alt="미리보기">
        <p id="uploadText">클릭해서 이미지 선택</p>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage()">
    <button id="btn" onclick="predict()" disabled>예측하기</button>

    <div class="result-box" id="resultBox">
        <div class="animal" id="animal"></div>
        <div class="label"  id="label"></div>
        <div class="conf"   id="conf"></div>
    </div>
</div>

<script>
    function previewImage() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;
        const img = document.getElementById('preview');
        img.src = URL.createObjectURL(file);
        img.style.display = 'block';
        document.getElementById('uploadText').style.display = 'none';
        document.getElementById('btn').disabled = false;
        document.getElementById('resultBox').style.display = 'none';
    }

    function predict() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;

        const btn = document.getElementById('btn');
        btn.textContent = '예측 중...';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('image', file);

        fetch('/predict', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                const box   = document.getElementById('resultBox');
                const label = document.getElementById('label');
                box.style.display = 'block';

                if (data.result === '알 수 없는 장면') {
                    box.classList.add('unknown');
                    label.classList.add('unknown');
                    document.getElementById('conf').textContent = '풍경 사진을 올려주세요.';
                } else {
                    box.classList.remove('unknown');
                    label.classList.remove('unknown');
                    document.getElementById('conf').textContent = '확률: ' + data.confidence;
                }

                document.getElementById('animal').textContent = data.emoji;
                document.getElementById('label').textContent  = data.result;
                btn.textContent = '예측하기';
                btn.disabled = false;
            });
    }
</script>
</body>
</html>
