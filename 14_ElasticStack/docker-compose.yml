# 반드시 상대경로나 절대경로를 제대로 인지하지 못할 경우에는
# docker-compose.yml을 작성한 폴더에서
# docker compose up -d
# 위 명령어 실행
# 참고로 회사는 이미 모든 세팅이 되어 있다.
# 우리는 도커 컴포즈를 이런식으로 작성하는 구나 정도 알면 된다.

# 파이썬에서는 v9인데 docker 이미에는 8.19.3버전 불일치
# pip install Elasticsearch = 최신버전 설치
# pip에 맞춰서 도커버전을 수정하거나

# 도커버전에 맞는 Elasticsearch 를 pip install로 설치할 수 있다.
# pip uninstall Elasticsearch -y
# pip install Elasticsearch==8.17.0

# 아래 코드는 Elasticsearch + Kibana 환경을 Docker로 구성하는 설정
services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.19.3
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: kibana:8.19.15
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  mysql-data:
  es-data:
